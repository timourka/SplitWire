# Example showing how to override splitwire.default.conf from the WireGuard file.
# Once [SplitWire] or any [Group "..."] is present here, the default rules file
# is NOT merged in: these groups become the complete policy.
[Interface]
PrivateKey = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
Address = 10.66.66.20/32

[Peer]
PublicKey = BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
Endpoint = vpn.example.com:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25

[SplitWire]
MTU = 1380
DNSRefreshSeconds = 60

[Group "Messengers"]
Apps = Discord.exe, Telegram.exe
Domains = *

[Group "AI"]
Apps = chrome.exe, firefox.exe, msedge.exe
Domains = chatgpt.com, *.chatgpt.com, openai.com, *.openai.com, oaistatic.com, *.oaistatic.com, oaiusercontent.com, *.oaiusercontent.com

[Group "YouTube"]
Apps = *
Domains = youtube.com, *.youtube.com, youtu.be, *.googlevideo.com, *.ytimg.com, youtubei.googleapis.com
